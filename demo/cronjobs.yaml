apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# Fails ~50% of the time: the intermittent failure case.
apiVersion: batch/v1
kind: CronJob
metadata: { name: flaky, namespace: demo }
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: main
              image: busybox:1.36
              command: ["sh", "-c", "echo starting; if [ $(( $(od -An -N1 -tu1 /dev/urandom) % 2 )) -eq 0 ]; then echo 'boom' >&2; exit 1; fi; echo ok"]
---
# Always succeeds: healthy baseline.
apiVersion: batch/v1
kind: CronJob
metadata: { name: healthy, namespace: demo }
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: main
              image: busybox:1.36
              command: ["sh", "-c", "echo ok"]
---
# Always fails: the "silent failure" (no successful run, nothing alerting).
apiVersion: batch/v1
kind: CronJob
metadata: { name: always-failing, namespace: demo }
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: main
              image: busybox:1.36
              command: ["sh", "-c", "echo 'db unreachable' >&2; exit 2"]
---
# Suspended: should be reported as suspended, not as missed.
apiVersion: batch/v1
kind: CronJob
metadata: { name: paused, namespace: demo }
spec:
  schedule: "*/2 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: main
              image: busybox:1.36
              command: ["sh", "-c", "echo ok"]
---
# Gets slower on every run (sleep grows with the minute), to exercise the duration trend.
apiVersion: batch/v1
kind: CronJob
metadata: { name: slowing, namespace: demo }
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 8
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: main
              image: busybox:1.36
              command: ["sh", "-c", "sleep $(( ($(date +%s) / 120) % 20 + 2 ))"]
---
# OOMKilled: groundwork for get_failure_details.
apiVersion: batch/v1
kind: CronJob
metadata: { name: oom, namespace: demo }
spec:
  schedule: "*/2 * * * *"
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: main
              image: polinux/stress
              resources: { limits: { memory: 20Mi } }
              command: ["stress", "--vm", "1", "--vm-bytes", "100M", "--vm-hang", "0"]
