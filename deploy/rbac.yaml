# Read-only by construction: get/list/watch only, on the five resources the tools need.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-cronjob-mcp
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-cronjob-mcp-readonly
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-cronjob-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-cronjob-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: k8s-cronjob-mcp
    namespace: default
