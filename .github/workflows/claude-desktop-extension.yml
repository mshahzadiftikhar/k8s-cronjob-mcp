name: Claude Desktop Extension

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build Claude Desktop extension
        run: npm run extension:pack

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag v$tag_version does not match package version $package_version" >&2
            exit 1
          fi

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-desktop-extension
          path: dist/k8s-cronjob-mcp.mcpb
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: claude-desktop-extension
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/k8s-cronjob-mcp.mcpb --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/k8s-cronjob-mcp.mcpb \
              --generate-notes \
              --verify-tag
          fi